services:
  - type: web
    name: paypal-ai-assistant
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: NODE_VERSION
        value: 22.12.0
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYPAL_INVOICER_BUSINESS_NAME
        sync: false
